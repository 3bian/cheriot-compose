[package]
name = "cheriot-compose"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Inspectable native CHERIoT firmware build plans"

[features]
host-tool-verification = []
rtos-verification = ["host-tool-verification"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.9"
toml_edit = { version = "0.23", default-features = false, features = ["parse"] }
